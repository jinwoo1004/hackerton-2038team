plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.xisnd'
version = '0.0.1-SNAPSHOT'
description = 'Monitoring Platform API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Test processes cannot inherit a user's live provider selection.
    environment 'APP_RUNTIME', 'test'
    environment 'LLM_PROVIDER', 'mock'
}

def privateRuntimeFile = { details ->
    def name = details.file.name.toLowerCase(Locale.ROOT)
    name == 'auth.json' || name == 'application-local.yml' || name == 'application-local.yaml' ||
        (!name.contains('.example.') && ((name.contains('secret') && (name.endsWith('.yml') || name.endsWith('.yaml'))) ||
            (name.contains('oauth') && name.contains('credential')) || (name.contains('credential') && name.endsWith('.json'))))
}
tasks.named('processResources') { exclude privateRuntimeFile }
// Defense in depth against resources left by an older build before the copy exclusion existed.
tasks.named('bootJar') { exclude privateRuntimeFile }

tasks.register('llmDiagnose', JavaExec) {
    group = 'verification'
    description = 'Validate explicit AI configuration without any model network request.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xisnd.monitoring.llm.LlmDiagnostic'
    args 'diagnose'
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('llmSmoke', JavaExec) {
    group = 'verification'
    description = 'Explicitly request one minimal structured response from the selected provider.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xisnd.monitoring.llm.LlmDiagnostic'
    args 'smoke'
    jvmArgs '-Dfile.encoding=UTF-8'
}
