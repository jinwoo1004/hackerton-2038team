spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/demo;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DEMO_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  demo:
    fixtures: ${APP_DEMO_FIXTURES:../demo-fixtures}
    heartbeat-enabled: ${APP_DEMO_HEARTBEAT_ENABLED:true}
  detection:
    enabled: false
