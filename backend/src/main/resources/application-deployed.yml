spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  storage:
    location: ${APP_STORAGE_LOCATION:/data/storage}
  analysis-service:
    base-url: ${APP_ANALYSIS_BASE_URL}
    shared-secret: ${APP_ANALYSIS_SHARED_SECRET}
  alerts:
    public-url: ${APP_PUBLIC_URL}
