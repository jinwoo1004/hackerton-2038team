spring:
  application:
    name: monitoring-backend
  profiles:
    # 서버에서는 mysql 프로파일 사용
    active: local
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 512MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  # AI reads process environment directly: APP_RUNTIME + LLM_PROVIDER, then only the selected
  # CODEX_MODEL/CODEX_AUTH_FILE (local) or OPENAI_MODEL/OPENAI_API_KEY (deployed).
  # Spring properties/profile aliases never override that credential and billing boundary.
  jwt:
    # 운영에서는 APP_JWT_SECRET 로 덮어쓴다
    secret: ${APP_JWT_SECRET:local-development-only-secret-key-change-me-please}
    expiration-minutes: 720
  cors:
    allowed-origins:
      - http://localhost:3200
      - http://127.0.0.1:3200
  storage:
    location: ${APP_STORAGE_LOCATION:./storage}
  analysis-service:
    # false면 분석 요청을 바로 실패 처리
    enabled: ${APP_ANALYSIS_ENABLED:true}
    base-url: ${APP_ANALYSIS_BASE_URL:http://localhost:8000}
    timeout-seconds: ${APP_ANALYSIS_TIMEOUT:600}
  telemetry:
    log-retention-days: ${APP_LOG_RETENTION_DAYS:14}
    metric-retention-days: ${APP_METRIC_RETENTION_DAYS:30}
  detection:
    enabled: ${APP_DETECTION_ENABLED:true}
    interval-ms: 60000
  alerts:
    # 알림 메시지의 "플랫폼에서 보기" 링크 주소
    public-url: ${APP_PUBLIC_URL:}
    slack-allowed-prefixes:
      - https://hooks.slack.com/services/

logging:
  level:
    com.xisnd.monitoring: INFO
